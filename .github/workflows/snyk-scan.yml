name: "SCA using Snyk"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  security-events: write

jobs:
  security_testing:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Dependencies
      run: npm install
    
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=low --json-file-output=snyk-results.json
    
    - name: Upload Snyk Results as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: snyk-scan-results
        path: snyk-results.json
        retention-days: 30
    
    - name: Generate HTML Report
      if: always()
      run: |
        # Installer snyk-to-html
        npm install -g snyk-to-html
        
        # Convertir JSON en HTML
        if [ -f snyk-results.json ]; then
          snyk-to-html -i snyk-results.json -o snyk-report.html
        fi
    
    - name: Upload HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: snyk-html-report
        path: snyk-report.html
        retention-days: 30