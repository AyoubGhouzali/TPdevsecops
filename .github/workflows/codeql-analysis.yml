name: "CodeQL Security Analysis"

# Déclencheurs du workflow
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Exécution quotidienne à 6h00 UTC
    - cron: '0 6 * * *'

# Permissions nécessaires pour CodeQL
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Code with CodeQL
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        # Langages à analyser dans Juice Shop
        language: [ 'javascript', 'typescript' ]

    steps:
    # Étape 1: Récupérer le code source
    - name: Checkout repository
      uses: actions/checkout@v4

    # Étape 2: Initialiser CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Utiliser les requêtes de sécurité étendues
        queries: security-extended,security-and-quality
        
    # Étape 3: Build automatique (si nécessaire)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # Étape 4: Exécuter l'analyse CodeQL
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        upload: true
        output: sarif-results
        
    # Étape 5: Télécharger les résultats SARIF
    - name: Upload SARIF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results-${{ matrix.language }}
        path: sarif-results
        retention-days: 30

    # Étape 6: Générer un rapport HTML (conversion SARIF → HTML)
    - name: Generate HTML Report
      if: always()
      run: |
        # Installer sarif-tools pour la conversion
        pip install sarif-tools
        
        # Créer un répertoire pour les rapports
        mkdir -p reports
        
        # Convertir SARIF en HTML pour chaque fichier
        for file in sarif-results/*.sarif; do
          if [ -f "$file" ]; then
            filename=$(basename "$file" .sarif)
            sarif html "$file" -o "reports/${filename}.html"
          fi
        done
        
        # Créer un index HTML
        cat > reports/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>CodeQL Security Analysis Report</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 40px; }
                h1 { color: #333; }
                .report-link { 
                    display: block; 
                    padding: 10px; 
                    margin: 10px 0; 
                    background: #f0f0f0; 
                    text-decoration: none; 
                    color: #0366d6;
                    border-radius: 5px;
                }
                .report-link:hover { background: #e0e0e0; }
            </style>
        </head>
        <body>
            <h1>CodeQL Security Analysis Reports</h1>
            <h2>Generated: $(date)</h2>
        EOF
        
        # Ajouter des liens vers chaque rapport
        for file in reports/*.html; do
          if [ -f "$file" ] && [ "$file" != "reports/index.html" ]; then
            filename=$(basename "$file")
            echo "<a class='report-link' href='$filename'>$filename</a>" >> reports/index.html
          fi
        done
        
        echo "</body></html>" >> reports/index.html

    # Étape 7: Télécharger les rapports HTML
    - name: Upload HTML Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-html-reports-${{ matrix.language }}
        path: reports/
        retention-days: 30

    # Étape 8: Résumé des résultats
    - name: Summary
      if: always()
      run: |
        echo "## CodeQL Analysis Complete for ${{ matrix.language }}" >> $GITHUB_STEP_SUMMARY
        echo "Results have been uploaded to Security tab" >> $GITHUB_STEP_SUMMARY
        echo "HTML reports are available in artifacts" >> $GITHUB_STEP_SUMMARY